[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-counter"
version = "0.4.1"
description = "Listen to Wiclax passing events and drive a Microgate display board."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tommaso Bertola", email = "bertola.tommaso@hotmail.it" }
]
keywords = ["wiclax", "microgate", "timing", "display", "tcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Communications",
  "Topic :: Utilities"
]
dependencies = []

[project.scripts]
lap-counter = "lap_counter.cli:main"
manual-lap-counter = "lap_counter.cli2:main"

[project.urls]
Homepage = "https://github.com/tommasobertola/lap-counter"
Repository = "https://github.com/tommasobertola/lap-counter"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lap_counter*"]

[tool.setuptools.package-data]
"lap_counter.display" = ["*.json"]
